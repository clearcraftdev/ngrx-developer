name: Update NgRx documentation

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: update-ngrx-documentation
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Refresh the stable NgRx documentation snapshot
        id: refresh
        run: node scripts/update-ngrx-docs.mjs
      - name: Check the skill
        id: check
        if: steps.refresh.outputs.changed == 'true'
        continue-on-error: true
        run: |
          node scripts/check-skill.mjs
          npx --yes skills@1.7.0 add . --list
          git diff --check
      # Patch and minor releases keep the curated guidance valid, so a snapshot
      # that passes every check is published at once. Majors, and snapshots that
      # break a check, wait for review.
      - name: Publish the documentation update
        if: >-
          steps.refresh.outputs.changed == 'true' &&
          steps.refresh.outputs.release != 'major' &&
          steps.check.outcome == 'success'
        env:
          VERSION: ${{ steps.refresh.outputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m "Update NgRx documentation snapshot to $VERSION"
          git push origin "HEAD:$BRANCH"
      - name: Open the documentation update pull request
        if: >-
          steps.refresh.outputs.changed == 'true' &&
          (steps.refresh.outputs.release == 'major' || steps.check.outcome != 'success')
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-ngrx-docs
          commit-message: Update NgRx documentation snapshot to ${{ steps.refresh.outputs.version }}
          delete-branch: true
          title: Update NgRx documentation snapshot to ${{ steps.refresh.outputs.version }}
          body: |
            NgRx ${{ steps.refresh.outputs.version }} (${{ steps.refresh.outputs.release }} release after
            ${{ steps.refresh.outputs.previous }}) was published and the bundled documentation
            snapshot was refreshed from the package's `gitHead`. Skill check: ${{ steps.check.outcome }}.

            Before merging:

            - review the upstream guide diff and migration notes;
            - update the curated `references/*.md` files and the version guidance in
              `SKILL.md` where behavior changed;
            - run `node scripts/check-skill.mjs` and fix every reported reference;
            - confirm that examples describe APIs available in the pinned version.
      # GitHub disables scheduled workflows after 60 days without repository
      # activity; enabling the workflow again keeps the daily check alive.
      - name: Keep the schedule enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable update-ngrx-docs.yml --repo "$GITHUB_REPOSITORY"
